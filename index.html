<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .main-header {
            background-image: linear-gradient(#e7f52c, aqua);
            height: 100vh;
            width: 100%;
        }

        .main_nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .navbar ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 8em;
        }

        .navbar ul li a {
            text-decoration: none;
            color: rgb(0, 0, 0);
            font-size: 40px;
            font-weight: bold;
            font-family: arial;
        }
        .profile {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2em;
            align-items: center;
            
        }
    
        .side_text div{
            font-family: arial black;
            font-size: 4.5em;
        }
        .side_text button{
            padding: 10px 20px;
            font-size: 1.5em;
            font-family: arial black;
            background-color: transparent;
            border: 2px solid black;
            cursor: pointer;
            margin-top: 2em;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="main_nav">
            <a href="#logo"><img src="logo.png" alt="Logo" height="100px" width="100px"></a>
            <nav class="navbar">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About Me</a></li>
                    <li><a href="#contact">Project</a></li>
                </ul>
            </nav>
        </div>
        <aside class="profile">
            <div class="profile_pic">
                <img src="profile.png" alt="">
            </div>
            <div class="side_text">
                <div class="prtfo">Portfolio</div>
                <div class="name">Ankush Joriya</div>
                <button>Click More</button>
            </div>
        </aside>
    </header>
</body>

</html>
